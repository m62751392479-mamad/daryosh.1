<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>داریوش | روزگار ساسانی</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#18251b;color:#fff0cf;font-family:Tahoma;overflow:hidden}
#game{width:100vw;height:100vh;display:block;background:#87966c}
#hud{position:absolute;top:8px;right:8px;left:8px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:5px}
.stat{background:#17251e;border:1px solid #d0b477;border-radius:9px;padding:7px;font-size:12px}
#menu{position:absolute;top:60px;right:8px;display:flex;gap:5px;flex-wrap:wrap}
button{background:#304b35;color:#fff0cf;border:1px solid #d0b477;border-radius:9px;padding:10px;font:13px Tahoma}
#bottom{position:absolute;bottom:12px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end}
#pad{width:115px;height:115px;border:2px solid #e0c98e;border-radius:50%;background:#14251d99;position:relative;touch-action:none}
#stick{position:absolute;left:33px;top:33px;width:45px;height:45px;border-radius:50%;background:#e2ca91}
#actions{display:flex;gap:5px}
#actions button{width:65px;height:62px;border-radius:50%}
#talk{border-radius:10px!important}
.panel{position:absolute;inset:0;background:#08110ddd;display:none;align-items:center;justify-content:center;padding:12px}
.box{width:95%;max-width:550px;max-height:90%;overflow:auto;background:#263a2b;border:2px solid #d0b477;border-radius:15px;padding:15px}
h2{color:#f0d18d}
p{line-height:1.8;font-size:14px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.row button{flex:1}
input{width:100%;padding:12px;background:#14231a;color:white;border:1px solid #c9a968;border-radius:8px;font:14px Tahoma}
#toast{position:absolute;top:115px;left:10%;right:10%;text-align:center;background:#14251e;border:1px solid #d0b477;border-radius:9px;padding:10px;display:none}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="stat">⚔ داریوش | <span id="place">بیشاپور</span></div>
 <div class="stat">❤️ <span id="hp">100</span></div>
 <div class="stat">🪙 <span id="gold">35</span></div>
 <div class="stat">🏅 <span id="rank">جوان‌سرباز</span></div>
</div>

<div id="menu">
 <button onclick="openMap()">🗺 نقشه</button>
 <button onclick="show('mission')">📜 مأموریت</button>
 <button onclick="show('gear')">🎒 تجهیزات</button>
 <button onclick="fullscreen()">⛶ تمام‌صفحه</button>
</div>

<div id="bottom">
 <div id="pad"><div id="stick"></div></div>
 <div id="actions">
  <button onclick="attack()">⚔<br>حمله</button>
  <button id="defend">🛡<br>دفاع</button>
  <button id="talk" onclick="interact()">💬<br>تعامل</button>
 </div>
</div>

<div id="toast"></div>

<div class="panel" id="dialog">
 <div class="box">
  <h2 id="npcTitle">گفت‌وگو</h2>
  <p id="npcText"></p>
  <div class="row" id="choices"></div>
  <input id="message" placeholder="پیامت را بنویس">
  <div class="row">
   <button onclick="sendMessage()">ارسال</button>
   <button onclick="hide('dialog')">بستن</button>
  </div>
  <p>گفت‌وگو در این نسخه با پاسخ‌های داخلی بازی انجام می‌شود و هنوز به هوش مصنوعی آنلاین متصل نیست.</p>
 </div>
</div>

<div class="panel" id="map">
 <div class="box">
  <h2>نقشهٔ شاهنشاهی ساسانی</h2>
  <div id="cities"></div>
  <button onclick="hide('map')">بازگشت</button>
 </div>
</div>

<div class="panel" id="mission">
 <div class="box">
  <h2>مأموریت داریوش</h2>
  <p id="missionText">با فرماندهٔ سپاه صحبت کن و به سپاه شاپور دوم بپیوند.</p>
  <button onclick="reward()">گرفتن پاداش</button>
  <button onclick="hide('mission')">بستن</button>
 </div>
</div>

<div class="panel" id="gear">
 <div class="box">
  <h2>تجهیزات</h2>
  <p id="gearText">شمشیر ساده | لباس سربازی | بدون سپر</p>
  <button onclick="buyShield()">خرید سپر چوبی ـ ۲۰ سکه</button>
  <button onclick="buyArmor()">خرید زره ـ ۳۰ سکه</button>
  <button onclick="hide('gear')">بستن</button>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let player={
 x:0,y:0,hp:100,gold:35,
 joined:false,shield:false,armor:false,
 defending:false
};

let cities=[
 "بیشاپور","گور","تیسفون","اصطخر",
 "کرمان","مرز روم","ری","مرو"
];

let city=0;
let people=[];
let rebels=[];
let joy={x:0,y:0};
let currentNPC=null;
let rewardTaken=false;
let spawnTime=0;
let last=0;

function initPeople(){
 people=[
 {name:"فرماندهٔ سپاه",kind:"commander",x:-140,y:50,color:"#873e32"},
 {name:"نگهبان شهر",kind:"guard",x:0,y:-140,color:"#405c83"},
 {name:"بازرگان",kind:"merchant",x:170,y:65,color:"#9b6638"},
 {name:"مسافر",kind:"traveler",x:100,y:-180,color:"#667d45"},
 {name:"ریش‌سفید",kind:"elder",x:-200,y:-100,color:"#80694e"}
 ];
}
initPeople();

function toast(t){
 let e=document.getElementById("toast");
 e.textContent=t;
 e.style.display="block";
 setTimeout(()=>e.style.display="none",2200);
}

function ui(){
 document.getElementById("place").textContent=cities[city];
 document.getElementById("hp").textContent=player.hp;
 document.getElementById("gold").textContent=player.gold;
 document.getElementById("rank").textContent=
 player.joined?"سرباز ساسانی":"جوان‌سرباز";
}

function show(id){document.getElementById(id).style.display="flex"}
function hide(id){document.getElementById(id).style.display="none"}

function pos(x,y){
 return {x:W/2+x-player.x,y:H/2+20+y-player.y};
}

function building(x,y,w,h){
 let p=pos(x,y);
 ctx.fillStyle="#ad8050";
 ctx.fillRect(p.x,p.y,w,h);
 ctx.fillStyle="#d1ad72";
 ctx.beginPath();
 ctx.moveTo(p.x-10,p.y+10);
 ctx.lineTo(p.x+w/2,p.y-35);
 ctx.lineTo(p.x+w+10,p.y+10);
 ctx.fill();
 ctx.fillStyle="#59412d";
 ctx.fillRect(p.x+w/2-12,p.y+h-40,24,40);
 ctx.fillRect(p.x+15,p.y+35,20,25);
}

function tree(x,y){
 let p=pos(x,y);
 ctx.fillStyle="#65482b";
 ctx.fillRect(p.x-3,p.y,6,18);
 ctx.fillStyle="#35573a";
 ctx.beginPath();
 ctx.arc(p.x,p.y-12,19,0,Math.PI*2);
 ctx.fill();
}

function person(x,y,color,name,hero=false,enemy=false){
 let p=pos(x,y);
 ctx.fillStyle="#0005";
 ctx.beginPath();
 ctx.ellipse(p.x,p.y+15,15,6,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle=color;
 ctx.fillRect(p.x-10,p.y-12,20,25);

 ctx.fillStyle="#d8b88b";
 ctx.beginPath();
 ctx.arc(p.x,p.y-20,10,0,Math.PI*2);
 ctx.fill();

 if(hero){
  ctx.fillStyle="#e4c16e";
  ctx.fillRect(p.x-5,p.y-34,10,5);
  ctx.strokeStyle="#ddd";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(p.x+10,p.y-5);
  ctx.lineTo(p.x+23,p.y-27);
  ctx.stroke();
 }

 ctx.fillStyle="#fff2d4";
 ctx.font="11px Tahoma";
 ctx.textAlign="center";
 ctx.fillText(name,p.x,p.y-40);
}

function draw(){
 ctx.clearRect(0,0,W,H);

 ctx.fillStyle="#87966c";
 ctx.fillRect(0,0,W,H);

 let tile=65;
 for(let y=0;y<H;y+=tile){
  for(let x=0;x<W;x+=tile){
   ctx.fillStyle=((x+y)/tile)%2?"#829165":"#89986c";
   ctx.fillRect(x,y,tile-2,tile-2);
  }
 }

 // جاده‌های شهر
 ctx.fillStyle="#c1aa7a";
 ctx.fillRect(W/2-65,0,130,H);
 ctx.fillRect(0,H/2-35,W,70);

 // دیوار شهر
 ctx.strokeStyle="#705b3e";
 ctx.lineWidth=12;
 ctx.strokeRect(W/2-360,H/2-280,720,560);

 // ساختمان‌ها
 building(-280,-210,140,110);
 building(140,-230,150,120);
 building(-280,130,145,110);
 building(180,130,145,110);
 building(-50,-280,100,80);

 tree(-200,-40);
 tree(230,-60);
 tree(-210,240);
 tree(260,240);
 tree(-80,260);

 // چاه میدان
 let p=pos(0,0);
 ctx.fillStyle="#796647";
 ctx.beginPath();
 ctx.arc(p.x,p.y,23,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="#4c7880";
 ctx.beginPath();
 ctx.arc(p.x,p.y,14,0,Math.PI*2);
 ctx.fill();

 people.forEach(n=>person(n.x,n.y,n.color,n.name));
 rebels.forEach(r=>person(r.x,r.y,"#7d342b","شورشی",false,true));
 person(player.x,player.y,"#9a80a8","داریوش",true);

 requestAnimationFrame(loop);
}

function nearest(){
 let all=[
  ...people.map(p=>({ref:p,type:"person"})),
  ...rebels.map(r=>({ref:r,type:"rebel"}))
 ];
 let best=null,d0=75;
 for(let a of all){
  let d=Math.hypot(a.ref.x-player.x,a.ref.y-player.y);
  if(d<d0){best=a;d0=d}
 }
 return best;
}

function interact(){
 let n=nearest();
 if(!n){toast("به یک شخصیت نزدیک شو.");return}
 currentNPC=n.ref;

 document.getElementById("npcTitle").textContent=
 n.ref.name||"شورشی";

 let text="درود بر تو، داریوش.";
 if(n.ref.kind==="commander")
  text="داریوش، سپاه شاهنشاه شاپور دوم به سربازان تازه نیاز دارد.";
 if(n.ref.kind==="merchant")
  text="به بازار خوش آمدی. چه چیزی نیاز داری؟";
 if(n.type==="rebel")
  text="شورشی راهت را سد کرده است!";

 document.getElementById("npcText").textContent=text;

 let c=document.getElementById("choices");
 c.innerHTML="";

 if(n.ref.kind==="commander"){
  addChoice("پیوستن به سپاه",()=>{
   player.joined=true;
   document.getElementById("missionText").textContent=
   "به سپاه شاپور دوم پیوستی. از شهر دفاع کن!";
   toast("به سپاه ساسانی پیوستی!");
   ui();
  });
 }
 if(n.type==="rebel"){
  addChoice("وادار به عقب‌نشینی",()=>{
   rebels=rebels.filter(r=>r!==n.ref);
   player.gold+=5;
   ui();
   toast("۵ سکه به دست آوردی.");
  });
 }

 show("dialog");
}

function addChoice(label,fn){
 let b=document.createElement("button");
 b.textContent=label;
 b.onclick=fn;
 document.getElementById("choices").appendChild(b);
}

function sendMessage(){
 let s=document.getElementById("message").value.trim();
 if(!s)return;

 let answer="در این روزگار خبرهای زیادی در شهر می‌پیچد.";
 if(s.includes("سلام"))answer="درود بر تو، داریوش!";
 if(s.includes("شاپور"))answer="شاهنشاه شاپور دوم فرمانروای ایران است.";
 if(s.includes("شورش"))answer="شورشی‌ها در نزدیکی شهر دیده شده‌اند.";
 if(s.includes("سپاه"))answer="فرماندهٔ سپاه در میدان شهر است.";
 if(s.includes("نام"))answer="من "+(currentNPC.name||"یک شورشی")+" هستم.";

 document.getElementById("npcText").textContent=
 "تو: "+s+"\n\n"+(currentNPC.name||"شورشی")+": "+answer;

 document.getElementById("message").value="";
}

function attack(){
 let n=nearest();
 if(!n||n.type!=="rebel"){
  toast("شورشی‌ای در نزدیکی تو نیست.");
  return;
 }
 n.ref.hp-=25;
 if(n.ref.hp<=0){
  rebels=rebels.filter(r=>r!==n.ref);
  player.gold+=8;
  toast("شورشی شکست خورد؛ ۸ سکه گرفتی.");
  ui();
 }else toast("ضربه وارد شد!");
}

function spawnRebel(){
 let a=Math.random()*Math.PI*2;
 let d=320;
 rebels.push({
  x:player.x+Math.cos(a)*d,
  y:player.y+Math.sin(a)*d,
  hp:50,cool:0
 });
 toast("⚠ شورشی‌ها به شهر نزدیک شده‌اند!");
}

function update(dt){
 let dx=joy.x,dy=joy.y;
 if(keys.ArrowRight)dx++;
 if(keys.ArrowLeft)dx--;
 if(keys.ArrowDown)dy++;
 if(keys.ArrowUp)dy--;

 let l=Math.hypot(dx,dy);
 if(l){
  player.x+=dx/l*150*dt;
  player.y+=dy/l*150*dt;
 }

 spawnTime+=dt;
 if(spawnTime>22&&rebels.length<4){
  spawnTime=0;
  spawnRebel();
 }

 rebels.forEach(r=>{
  let d=Math.hypot(player.x-r.x,player.y-r.y);
  if(d>32){
   r.x+=(player.x-r.x)/d*48*dt;
   r.y+=(player.y-r.y)/d*48*dt;
  }else{
   r.cool-=dt;
   if(r.cool<=0){
    r.cool=1.5;
    player.hp=Math.max(0,player.hp-(player.defending?2:8));
    ui();
    toast("شورشی به تو حمله کرد!");
    if(player.hp===0){
     player.hp=100;
     player.gold=Math.max(0,player.gold-10);
     player.x=player.y=0;
     toast("عقب‌نشینی کردی و ۱۰ سکه از دست دادی.");
     ui();
    }
   }
  }
 });
}

function loop(t){
 let dt=Math.min((t-last)/1000||0,.04);
 last=t;
 update(dt);
 draw();
}

function openMap(){
 let el=document.getElementById("cities");
 el.innerHTML="";
 cities.forEach((name,i)=>{
  let b=document.createElement("button");
  b.textContent=name;
  b.style.margin="4px";
  b.onclick=()=>{
   city=i;
   player.x=player.y=0;
   rebels=[];
   initPeople();
   ui();
   hide("map");
   toast("به "+name+" رسیدی.");
  };
  el.appendChild(b);
 });
 show("map");
}

function reward(){
 if(player.joined&&!rewardTaken){
  player.gold+=15;
  rewardTaken=true;
  ui();
  toast("۱۵ سکه پاداش گرفتی!");
 }else toast("ابتدا به سپاه بپیوند یا پاداش را قبلاً گرفته‌ای.");
}

function buyShield(){
 if(player.gold>=20&&!player.shield){
  player.gold-=20;
  player.shield=true;
  ui();
  toast("سپر چوبی خریدی.");
 }else toast("سکه کافی نداری یا سپر را داری.");
}

function buyArmor(){
 if(player.gold>=30&&!player.armor){
  player.gold-=30;
  player.armor=true;
  ui();
  toast("زره آهنی خریدی.");
 }else toast("سکه کافی نداری یا زره را داری.");
}

function fullscreen(){
 if(!document.fullscreenElement){
  document.documentElement.requestFullscreen?.();
 }else document.exitFullscreen?.();
}

// دستهٔ لمسی
const pad=document.getElementById("pad");
const stick=document.getElementById("stick");
let pointer=null;

function moveStick(e){
 let r=pad.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 let l=Math.hypot(x,y),m=33;
 if(l>m){x=x/l*m;y=y/l*m}
 joy.x=x/m;joy.y=y/m;
 stick.style.left=(33+x)+"px";
 stick.style.top=(33+y)+"px";
}

pad.addEventListener("pointerdown",e=>{
 pointer=e.pointerId;
 pad.setPointerCapture(pointer);
 moveStick(e);
});
pad.addEventListener("pointermove",e=>{
 if(e.pointerId===pointer)moveStick(e);
});
function stop(){
 pointer=null;
 joy.x=joy.y=0;
 stick.style.left="33px";
 stick.style.top="33px";
}
pad.addEventListener("pointerup",stop);
pad.addEventListener("pointercancel",stop);

addEventListener("keydown",e=>keys[e.key]=true);
addEventListener("keyup",e=>keys[e.key]=false);

document.getElementById("defend").onpointerdown=()=>{
 player.defending=true;
};
document.getElementById("defend").onpointerup=()=>{
 player.defending=false;
};
document.getElementById("defend").onpointercancel=()=>{
 player.defending=false;
};

ui();
requestAnimationFrame(loop);
</script>
</body>
</html>
